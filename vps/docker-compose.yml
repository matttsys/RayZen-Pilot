services:
  rayzen-pilot:
    build: .
    image: rayzen-pilot:latest
    container_name: rayzen-pilot
    restart: unless-stopped
    env_file: .env
    volumes:
      - pilot-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pilot-data:
