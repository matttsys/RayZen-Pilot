<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" role="img" aria-label="امکانات">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#0D2433"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122334"/>
      <stop offset="1" stop-color="#0F1C2A"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CC6F6"/><stop offset="1" stop-color="#1A86C8"/></linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D6B8"/><stop offset="1" stop-color="#119C86"/></linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C15C"/><stop offset="1" stop-color="#D9901F"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A7A9C"/>
    </marker>
  </defs>
  <rect width="1280" height="704" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="704" rx="24" fill="url(#dots)"/>
  <rect x="860" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="1176" y="52" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(1187.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="1228" y="136" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">مدیریت اعضا</text>
  <text x="1228" y="166" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">بن، سکوت، اخطار و اخراج با ریپلای،</text>
  <text x="1228" y="188" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">آیدی عددی یا یوزرنیم؛ حتی اگر</text>
  <text x="1228" y="210" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">کاربر از گروه رفته باشد⁦.⁩</text>
  <rect x="444" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="760" y="52" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(771.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
  <text x="812" y="136" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">قفل واقعی</text>
  <text x="812" y="166" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">قفل شبانه و قفل کامل با دسترسی‌های</text>
  <text x="812" y="188" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">خود تلگرام کار می‌کنند، نه پاک کردن پیام⁦.⁩</text>
  <text x="812" y="210" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">باز کردن قفل همه‌چیز را برمی‌گرداند⁦.⁩</text>
  <rect x="28" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="344" y="52" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(355.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></g>
  <text x="396" y="136" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">فیلترهای اختیاری</text>
  <text x="396" y="166" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">لینک، فوروارد، رسانه، فلود، کپچا و ضد رید⁦.⁩</text>
  <text x="396" y="188" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">همه از اول خاموش‌اند؛ تا نخواهید</text>
  <text x="396" y="210" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">هیچ پیامی پاک نمی‌شود⁦.⁩</text>
  <rect x="860" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="1176" y="276" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(1187.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></g>
  <text x="1228" y="360" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">دستیار هوش مصنوعی</text>
  <text x="1228" y="390" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">درخواستت را ساده بنویس⁦.⁩ اول پیش‌نمایش</text>
  <text x="1228" y="412" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">می‌بینی، تأیید می‌کنی و نتیجهٔ واقعی</text>
  <text x="1228" y="434" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">را می‌گیری⁦.⁩</text>
  <rect x="444" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="760" y="276" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(771.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
  <text x="812" y="360" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">لاگ مطمئن</text>
  <text x="812" y="390" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">گروه لاگ با یک پیام تست بررسی می‌شود⁦.⁩</text>
  <text x="812" y="412" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">ارسال ناموفق دوباره امتحان می‌شود و</text>
  <text x="812" y="434" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">قطع شدن مسیر خبر داده می‌شود⁦.⁩</text>
  <rect x="28" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="344" y="276" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(355.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g>
  <text x="396" y="360" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">تاریخچه و برگشت</text>
  <text x="396" y="390" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">همهٔ کارها ثبت می‌شوند⁦.⁩ برگرداندن،</text>
  <text x="396" y="412" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">پرونده، و درخواست تجدیدنظر اعضا</text>
  <text x="396" y="434" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">از پیوی ربات⁦.⁩</text>
  <rect x="860" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="1176" y="500" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(1187.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v3l2 1"/></g>
  <text x="1228" y="584" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">زمان‌بندی</text>
  <text x="1228" y="614" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">اطلاعیه، یادآوری، نظرسنجی و رویداد</text>
  <text x="1228" y="636" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">با ساعت گروه؛ پیش‌فرض تهران⁦.⁩</text>
  <text x="1228" y="658" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">بعد از ری‌استارت هم دوباره ارسال نمی‌شوند⁦.⁩</text>
  <rect x="444" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="760" y="500" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(771.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
  <text x="812" y="584" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">میز اعضا</text>
  <text x="812" y="614" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">درخواست عضویت با سؤال ورود،</text>
  <text x="812" y="636" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">تیکت پشتیبانی و</text>
  <text x="812" y="658" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">ابزار تاپیک‌ها⁦.⁩</text>
  <rect x="28" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="344" y="500" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(355.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></g>
  <text x="396" y="584" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="21" fill="#EAF2FA" font-weight="700" direction="rtl" text-anchor="start">حریم خصوصی</text>
  <text x="396" y="614" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">پیام‌های گروه هیچ‌وقت ذخیره نمی‌شوند⁦.⁩</text>
  <text x="396" y="636" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">دورهٔ نگهداری، خروجی داده</text>
  <text x="396" y="658" font-family="Vazirmatn, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="14.5" fill="#9DB2C7" direction="rtl" text-anchor="start">و ⁦/forgetme⁩ آماده‌اند⁦.⁩</text>
</svg>
