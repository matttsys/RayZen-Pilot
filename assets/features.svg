<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" role="img" aria-label="Features">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#0D2433"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122334"/>
      <stop offset="1" stop-color="#0F1C2A"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CC6F6"/><stop offset="1" stop-color="#1A86C8"/></linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D6B8"/><stop offset="1" stop-color="#119C86"/></linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C15C"/><stop offset="1" stop-color="#D9901F"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A7A9C"/>
    </marker>
  </defs>
  <rect width="1280" height="704" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="704" rx="24" fill="url(#dots)"/>
  <rect x="28" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="52" y="52" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(63.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g>
  <text x="52" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Moderation</text>
  <text x="52" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Ban, mute, warn and kick by reply,</text>
  <text x="52" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">numeric id or @username, even if</text>
  <text x="52" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">the user already left the group.</text>
  <rect x="444" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="468" y="52" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(479.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
  <text x="468" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Real locks</text>
  <text x="468" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Night lock and lockdown change</text>
  <text x="468" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Telegram permissions, not messages.</text>
  <text x="468" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Unlock puts back exactly what was there.</text>
  <rect x="860" y="28" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="884" y="52" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(895.0 63.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></g>
  <text x="884" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Opt-in filters</text>
  <text x="884" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Links, forwards, media, flood, captcha,</text>
  <text x="884" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">anti-raid. All of them start off.</text>
  <text x="884" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Nothing is deleted until you say so.</text>
  <rect x="28" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="52" y="276" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(63.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></g>
  <text x="52" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">AI assistant</text>
  <text x="52" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Ask in plain Persian or English.</text>
  <text x="52" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">You see a preview, press confirm,</text>
  <text x="52" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">and get the real result back.</text>
  <rect x="444" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="468" y="276" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(479.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g>
  <text x="468" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Verified logs</text>
  <text x="468" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">The log chat is checked with a test</text>
  <text x="468" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">entry. Failed sends are retried and</text>
  <text x="468" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">you hear about it when a route breaks.</text>
  <rect x="860" y="252" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="884" y="276" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(895.0 287.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g>
  <text x="884" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">History and undo</text>
  <text x="884" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Every action is recorded. Undo it,</text>
  <text x="884" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">open a case, or let members appeal</text>
  <text x="884" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">from the bot's private chat.</text>
  <rect x="28" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="52" y="500" width="52" height="52" rx="14.0" fill="url(#g-blue)"/>
  <g transform="translate(63.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v3l2 1"/></g>
  <text x="52" y="584" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Scheduling</text>
  <text x="52" y="614" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Announcements, reminders, polls</text>
  <text x="52" y="636" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">and events in the group's timezone.</text>
  <text x="52" y="658" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Asia/Tehran unless you change it.</text>
  <rect x="444" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="468" y="500" width="52" height="52" rx="14.0" fill="url(#g-teal)"/>
  <g transform="translate(479.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
  <text x="468" y="584" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Member desk</text>
  <text x="468" y="614" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Join requests with a screening</text>
  <text x="468" y="636" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">question, support tickets and</text>
  <text x="468" y="658" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">forum topic tools.</text>
  <rect x="860" y="476" width="392" height="200" rx="18" fill="url(#card)" stroke="#203A52"/>
  <rect x="884" y="500" width="52" height="52" rx="14.0" fill="url(#g-amber)"/>
  <g transform="translate(895.0 511.0) scale(1.250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></g>
  <text x="884" y="584" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#EAF2FA" font-weight="700">Privacy</text>
  <text x="884" y="614" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Message text is never stored; only a</text>
  <text x="884" y="636" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">48h word index for /purgeword.</text>
  <text x="884" y="658" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9DB2C7">Retention, export and /forgetme.</text>
</svg>
